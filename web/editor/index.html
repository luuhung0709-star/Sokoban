<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sokoban — Level editor</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/ui.css">
  <style>
    .editor { padding: 20px; display: grid; gap: 16px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; gap: 1px; width: max-content; background: var(--panel-line); }
    /*
     * Cell colours come straight from the board palette in base.css rather than
     * copied hex values: retune the game once and the editor follows. They used to be
     * hard-copied, which left the editor stuck on the palette from when boxes were
     * wooden crates — you would draw a level, open the game, and see something else.
     */
    .grid button {
      width: 26px; height: 26px; border: 0; cursor: pointer;
      background: var(--floor); color: var(--text); font: 14px/1 monospace;
    }
    .grid button[data-char="."] { background: var(--goal-bg); }

    /*
     * Walls and boxes are both LIGHT colours, so the text colour has to flip dark.
     * Keeping the light text used on dark cells would sink the '#' and '$' glyphs,
     * and the editor is read by character, not by colour alone.
     */
    .grid button[data-char="#"] { background: var(--wall-face); color: var(--bg); }
    .grid button[data-char="$"],
    .grid button[data-char="*"] { background: var(--box); color: var(--bg); }

    /* The player deliberately uses a colour outside the board palette to stand out. */
    .grid button[data-char="@"],
    .grid button[data-char="+"] { background: #2f7fd4; }
    .brush[aria-pressed="true"] { outline: 2px solid var(--accent); }
    .issues { color: #ff9c94; white-space: pre-line; min-height: 1.5em; }
    textarea { width: 100%; min-height: 130px; background: #0e1218; color: var(--text);
               border: 1px solid var(--panel-line); border-radius: 6px; padding: 8px;
               font: 12px/1.45 monospace; }
  </style>
</head>
<body>
  <div class="editor">
    <h1 class="panel__title" style="text-align:left">Level editor</h1>

    <div class="row" id="brushes"></div>

    <div class="row">
      Width <input id="width" type="number" min="3" max="40" value="9">
      Height <input id="height" type="number" min="3" max="24" value="7">
      <button class="btn" id="btn-resize" type="button">Resize</button>
      <button class="btn" id="btn-clear" type="button">Clear</button>
      <button class="btn" id="btn-check" type="button">Check</button>
      <button class="btn" id="btn-export" type="button">Export JSON</button>
      <button class="btn" id="btn-download" type="button">Download JSON</button>
    </div>

    <div class="grid" id="grid"></div>
    <p class="issues" id="issues"></p>

    <div class="row" style="width:100%">
      <button class="btn" id="btn-import" type="button">Import .txt</button>
      <span class="panel__hint" style="margin:0">Paste Microban text into the box below, then press Import</span>
    </div>
    <textarea id="io" spellcheck="false"></textarea>
  </div>

  <script type="module" src="editor.js"></script>
</body>
</html>
