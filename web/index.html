<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sokoban</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/board.css">
  <link rel="stylesheet" href="styles/ui.css">
</head>
<body data-screen="menu">
  <section class="screen screen--menu" data-name="menu">
    <div class="panel">
      <h1 class="panel__title">Sokoban</h1>
      <p class="panel__hint">Arrows or WASD to move · U undo · R restart level · Esc exit</p>
      <div class="panel__actions">
        <button class="btn btn--big" id="btn-continue" type="button">Continue</button>
        <button class="btn btn--big" id="btn-levels" type="button">Select level</button>
        <button class="btn btn--big" id="btn-menu-mute" type="button" aria-pressed="false">Sound: on</button>
      </div>
    </div>
  </section>

  <section class="screen screen--levels" data-name="levels">
    <header class="hud">
      <span class="hud__name">Select level</span>
      <span class="hud__spacer"></span>
      <button class="btn" id="btn-levels-back" type="button">← Menu</button>
    </header>
    <div class="levels" id="levels"></div>
  </section>

  <main class="screen screen--play" data-name="play">
    <header class="hud" id="hud">
      <span class="hud__name" id="hud-name">Level 1</span>
      <span class="hud__stat">Moves <b id="hud-moves">0</b></span>
      <span class="hud__stat">Pushes <b id="hud-pushes">0</b></span>
      <span class="hud__spacer"></span>
      <button class="btn btn--ghost" id="btn-mute" type="button" aria-pressed="false">🔊</button>
    </header>

    <div class="stage" id="stage">
      <div class="board" id="board"></div>

      <div class="overlay" id="complete" hidden>
        <div class="panel">
          <h2 class="panel__title">Level complete!</h2>
          <p class="panel__stats" id="complete-stats"></p>
          <p class="panel__hint" id="complete-best"></p>
          <div class="panel__actions">
            <button class="btn btn--big" id="btn-next" type="button">Next level →</button>
            <button class="btn btn--big" id="btn-retry" type="button">Play again</button>
            <button class="btn btn--big" id="btn-to-levels" type="button">Select level</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="toolbar">
      <button class="btn" id="btn-undo" type="button">↶ Undo</button>
      <button class="btn" id="btn-restart" type="button">⟳ Restart</button>
      <button class="btn" id="btn-exit" type="button">← Select level</button>
    </footer>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
